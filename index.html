
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex - Módulo 3</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-6">

    <main class="max-w-5xl mx-auto">

        <!-- Encabezado -->
        <header class="text-center mb-8">

            <p class="text-sm font-semibold text-blue-600 uppercase tracking-widest mb-2">
                Explora el mundo Pokémon
            </p>

            <h1 class="text-4xl font-extrabold text-slate-800">
                Pokédex
            </h1>

            <p class="text-slate-500 mt-2">
                Encuentra información de tus Pokémon favoritos.
            </p>

        </header>

        <!-- Buscador -->
        <section class="max-w-md mx-auto mb-8">

            <label for="buscador" class="sr-only">
                Buscar Pokémon
            </label>

            <input
                id="buscador"
                type="search"
                placeholder="🔎 Filtra por nombre..."
                autocomplete="off"
                class="w-full p-4 rounded-xl border border-slate-300
                focus:outline-none focus:ring-2 focus:ring-blue-500
                bg-white shadow-sm"
            >

            <p id="contador" class="text-sm text-slate-500 mt-3 text-center"
               aria-live="polite">
            </p>

        </section>

        
        
<!-- Spinner de carga -->
            <div id="spinner" class="hidden text-center py-8">

                <div class="w-12 h-12 border-4 border-blue-500
                            border-t-transparent rounded-full animate-spin mx-auto">
                </div>

                <p class="text-slate-500 mt-3 text-sm">
                    Cargando Pokémon...
                </p>

            </div>


        <!-- Resultados -->
        <section
            id="resultado"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
            aria-live="polite"
        >
        </section>

    </main>

    <script src="script.js" defer></script>

</body>

</html>
